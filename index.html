<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>監考系統看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #FAF8F5 0%, #F4F1EB 100%);
            color: #333;
            overflow-x: hidden;
        }
        /* 隱藏滾動條但保留功能 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .timer-shadow {
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6 select-none relative">

    <!-- 頂部資訊列 -->
    <header class="flex justify-between items-center mb-4 px-2">
        <div class="flex items-center gap-3">
            <div class="bg-gray-100 p-2 rounded-lg text-xl shadow-inner">📋</div>
            <h1 id="board-title" class="text-2xl md:text-3xl font-bold text-gray-700 tracking-wide">期中定期評量</h1>
        </div>
        
        <div class="absolute left-1/2 transform -translate-x-1/2 text-center">
            <div id="current-time" class="text-4xl md:text-5xl font-bold text-gray-800 tracking-wider">--:--:--</div>
        </div>

        <div class="flex items-center gap-4 text-gray-500 font-medium">
            <div id="current-date">--年--月--日 星期-</div>
            <button onclick="toggleFullScreen()" class="flex items-center gap-1 hover:bg-gray-200/50 px-3 py-1.5 rounded-lg transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
                全螢幕
            </button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
        
        <!-- 左側：計時與進度 (佔據2格) -->
        <div class="lg:col-span-2 bg-white rounded-[32px] p-8 shadow-sm border border-gray-100 flex flex-col relative overflow-hidden">
            <!-- 裝飾背景圈圈 -->
            <div class="absolute -top-20 -right-20 w-64 h-64 bg-pink-50 rounded-full opacity-50 pointer-events-none"></div>
            
            <div class="relative z-10 flex-grow flex flex-col justify-between">
                <!-- 科目與時間 -->
                <div>
                    <span id="subject-status-tag" class="inline-block bg-pink-100 text-pink-700 px-4 py-1 rounded-full text-sm font-bold mb-4">
                        準備中
                    </span>
                    <div class="flex items-end gap-6 mb-6">
                        <h2 id="current-subject-name" class="text-7xl md:text-8xl font-black text-gray-800 tracking-widest">--</h2>
                        <span id="current-subject-time" class="text-2xl text-gray-500 font-medium mb-2 bg-gray-100 px-4 py-1 rounded-2xl">--:-- - --:--</span>
                    </div>
                </div>

                <!-- 巨大倒數計時區 -->
                <div class="bg-[#FDEB9D] rounded-3xl p-8 shadow-inner flex flex-col items-center justify-center mb-8 relative">
                    <div id="countdown-label" class="text-gray-700 font-bold mb-2 text-lg self-start">距離考試開始還有</div>
                    <div id="countdown-timer" class="text-7xl md:text-[8rem] leading-none font-black text-[#4A4238] tracking-widest timer-shadow">
                        --:--:--
                    </div>
                </div>

                <!-- 進度條 -->
                <div class="mt-auto px-4 relative pb-6">
                    <!-- 圖示游標 -->
                    <div id="progress-cursor" class="absolute -top-8 text-3xl transition-all duration-1000 ease-linear transform -translate-x-1/2" style="left: 0%;">
                        🌱
                    </div>
                    <!-- 軌道 -->
                    <div class="h-4 bg-gray-100 rounded-full w-full border border-gray-200 overflow-hidden relative shadow-inner">
                        <div id="progress-fill" class="h-full bg-[#E8F5F1] transition-all duration-1000 ease-linear w-0"></div>
                    </div>
                    <!-- 標籤 -->
                    <div class="flex justify-between text-xs text-gray-400 font-medium mt-2 px-1">
                        <span>開始</span>
                        <span>繼續加油</span>
                        <span>完成</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側：資訊面板 -->
        <div class="bg-white rounded-[32px] p-6 shadow-sm border border-gray-100 flex flex-col gap-4">
            
            <!-- 應考資訊 -->
            <div class="border border-gray-100 rounded-2xl p-4 flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-gray-700 flex items-center gap-2">
                        <span class="text-blue-500">👥</span> 應考資訊
                    </h3>
                    <span id="attendance-rate" class="text-teal-500 font-bold text-sm">--%</span>
                </div>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="border border-gray-100 rounded-xl p-2 bg-gray-50/50">
                        <div class="text-xs text-gray-400 mb-1">應到</div>
                        <div id="info-expected" class="text-3xl font-bold text-gray-700">--</div>
                    </div>
                    <div class="border border-gray-100 rounded-xl p-2 bg-gray-50/50">
                        <div class="text-xs text-gray-400 mb-1">實到</div>
                        <div id="info-actual" class="text-3xl font-bold text-gray-700">--</div>
                    </div>
                    <div class="border border-red-100 rounded-xl p-2 bg-red-50/30">
                        <div class="text-xs text-red-400 mb-1">未到</div>
                        <div id="info-absent" class="text-3xl font-bold text-red-500">--</div>
                    </div>
                </div>
            </div>

            <!-- 考場提醒 -->
            <div class="bg-[#FDF2F4] rounded-2xl p-5 flex-grow">
                <h3 class="text-xs font-bold text-pink-400 mb-2">考場提醒</h3>
                <p id="info-reminders" class="text-gray-700 font-medium text-lg leading-relaxed whitespace-pre-wrap">
                    --
                </p>
            </div>

            <!-- 未到學生 -->
            <div class="border border-gray-100 rounded-2xl p-5 bg-gray-50/50">
                <h3 class="text-xs font-bold text-gray-400 mb-2">未到學生姓名</h3>
                <p id="info-absent-names" class="text-gray-800 font-bold text-lg">
                    --
                </p>
            </div>
        </div>

    </main>

    <!-- 底部：考程與設定按鈕 -->
    <footer class="flex items-center gap-4 relative">
        <div id="schedule-container" class="flex-grow flex gap-4 overflow-x-auto pb-2">
            <!-- 考程卡片將由 JS 生成 -->
        </div>

        <button onclick="openModal()" class="flex-shrink-0 bg-[#F0EEEA] hover:bg-[#E2DDD6] text-gray-700 font-bold py-3 px-6 rounded-2xl shadow-sm transition flex items-center gap-2">
            <span>🔒</span> 教師設定
        </button>
    </footer>

    <!-- ================= 教師設定彈窗 (Modal) ================= -->
    <div id="settings-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden items-center justify-center">
        <div class="bg-white rounded-3xl shadow-2xl w-[90%] max-w-2xl max-h-[90vh] overflow-y-auto relative animate-fade-in-up">
            
            <!-- Modal Header -->
            <div class="sticky top-0 bg-white/95 backdrop-blur z-10 px-8 py-5 border-b border-gray-100 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800">教師控制後台</h2>
                <div class="flex gap-2">
                    <button type="button" onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                    </button>
                </div>
            </div>

            <!-- Modal Body -->
            <div class="p-8 space-y-6">
                <!-- 基本設定 -->
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-2">看板標題</label>
                        <input type="text" id="set-title" class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-2">考試日期</label>
                        <input type="date" id="set-date" class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none">
                    </div>
                </div>

                <!-- 人數設定 -->
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-2">應到人數</label>
                        <input type="number" id="set-expected" class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-2">實到人數</label>
                        <input type="number" id="set-actual" class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none">
                    </div>
                </div>

                <!-- 未到名單 -->
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-2">未到學生姓名</label>
                    <input type="text" id="set-absent-names" class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>

                <!-- 提醒文字 -->
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-2">考場提醒文字</label>
                    <textarea id="set-reminders" rows="2" class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none"></textarea>
                </div>

                <!-- 其他設定 (鐘聲 & 游標) -->
                <div class="grid grid-cols-2 gap-6 items-end bg-gray-50 p-4 rounded-2xl">
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="set-autobell" class="w-5 h-5 text-teal-500 rounded focus:ring-teal-500 cursor-pointer">
                        <label for="set-autobell" class="text-sm font-bold text-gray-700 cursor-pointer">🔔 自動鐘聲 (開始、結束及最後5分鐘)</label>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-2">進度游標</label>
                        <select id="set-cursor" class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none bg-white">
                            <option value="🌱">🌱 小芽精靈</option>
                            <option value="🐣">🐣 圓滾滾小雞</option>
                            <option value="🐰">🐰 小兔子</option>
                            <option value="🐹">🐹 小倉鼠</option>
                            <option value="⭐">⭐ 小星星</option>
                        </select>
                    </div>
                </div>

                <!-- 考程設定 -->
                <div>
                    <h3 class="font-bold text-gray-700 mb-3 border-b pb-2">當日考程</h3>
                    <div id="set-schedule-list" class="space-y-3 mb-4 max-h-48 overflow-y-auto pr-2">
                        <!-- 動態生成考程列表 -->
                    </div>
                    <button type="button" onclick="addScheduleItem()" class="w-full py-2 border-2 border-dashed border-gray-300 text-gray-500 rounded-xl hover:bg-gray-50 hover:border-gray-400 transition font-bold text-sm">
                        + 新增考科
                    </button>
                    <p class="text-xs text-gray-400 mt-2 text-center">系統會依日常時間自動切換考科；也可在學生畫面點選下方考科手動切換。</p>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="sticky bottom-0 bg-white/95 backdrop-blur z-10 px-8 py-4 border-t border-gray-100 flex justify-end gap-3 rounded-b-3xl">
                <button type="button" onclick="closeModal()" class="px-6 py-2 text-gray-500 font-bold hover:bg-gray-100 rounded-xl transition">取消</button>
                <button type="button" onclick="saveSettings()" class="px-6 py-2 bg-[#42B89D] hover:bg-[#349e86] text-white font-bold rounded-xl transition shadow-md">儲存並套用</button>
            </div>
        </div>
    </div>

    <script>
        // --- 狀態管理 ---
        let state = {
            title: "期中定期評量",
            date: "2026-11-05",
            expected: 26,
            actual: 25,
            absentNames: "陳怡臻",
            reminders: "請專心作答，完成後記得檢查答案。",
            autoBell: false,
            cursor: "🌱",
            schedule: [
                { id: 1, name: "國語", start: "08:20", end: "09:10" },
                { id: 2, name: "自然", start: "09:20", end: "10:00" }
            ],
            manualSubjectIndex: -1 // -1 代表自動判斷
        };

        let timerInterval;
        let clockInterval;

        // --- 初始化 ---
        function init() {
            // 設定預設日期為今天 (僅為了展示效果)
            const today = new Date();
            state.date = today.toISOString().split('T')[0];

            updateUI();
            startClocks();
            renderSettingsModal();
        }

        // --- UI 更新邏輯 ---
        function updateUI() {
            // 更新右側面板
            document.getElementById('board-title').innerText = state.title;
            document.getElementById('info-expected').innerText = state.expected;
            document.getElementById('info-actual').innerText = state.actual;
            document.getElementById('info-absent').innerText = state.expected - state.actual;
            document.getElementById('info-absent-names').innerText = state.absentNames || "無";
            document.getElementById('info-reminders').innerText = state.reminders;
            document.getElementById('progress-cursor').innerText = state.cursor;
            
            let rate = Math.round((state.actual / state.expected) * 100) || 0;
            document.getElementById('attendance-rate').innerText = `${rate}%`;

            renderScheduleBottom();
        }

        // --- 時間與排程運算 ---
        function startClocks() {
            if (clockInterval) clearInterval(clockInterval);
            if (timerInterval) clearInterval(timerInterval);

            // 更新右上角時鐘
            clockInterval = setInterval(() => {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                const days = ['日', '一', '二', '三', '四', '五', '六'];
                const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${days[now.getDay()]}`;
                
                document.getElementById('current-time').innerText = timeStr;
                document.getElementById('current-date').innerText = dateStr;
            }, 1000);

            // 核心倒數與進度邏輯
            timerInterval = setInterval(() => {
                updateDashboardLogic();
            }, 500); // 頻繁一點讓進度條平滑
        }

        function updateDashboardLogic() {
            if (state.schedule.length === 0) return;

            const now = new Date();
            // 解析目標日期
            const [y, m, d] = state.date.split('-');
            
            // 決定當前科目 (自動或手動)
            let currentIdx = state.manualSubjectIndex;
            
            if (currentIdx === -1) {
                // 自動尋找當前或下一個科目
                currentIdx = 0; // 預設第一個
                for (let i = 0; i < state.schedule.length; i++) {
                    const sch = state.schedule[i];
                    const [endH, endM] = sch.end.split(':');
                    const endTime = new Date(y, m-1, d, endH, endM);
                    if (now < endTime) {
                        currentIdx = i;
                        break;
                    }
                    if (i === state.schedule.length - 1) {
                        currentIdx = i; // 都結束了停在最後一個
                    }
                }
            }

            const activeSchedule = state.schedule[currentIdx];
            
            // 更新畫面資訊
            document.getElementById('current-subject-name').innerText = activeSchedule.name;
            document.getElementById('current-subject-time').innerText = `${activeSchedule.start} - ${activeSchedule.end}`;
            
            // 更新底部排程樣式
            document.querySelectorAll('.schedule-card').forEach((el, idx) => {
                if (idx === currentIdx) {
                    el.className = "schedule-card flex-shrink-0 w-64 p-3 rounded-2xl border-2 border-[#42B89D] bg-[#E8F5F1] shadow-sm flex items-center gap-3 cursor-pointer transition";
                } else {
                    el.className = "schedule-card flex-shrink-0 w-64 p-3 rounded-2xl border border-gray-200 bg-white hover:bg-gray-50 flex items-center gap-3 cursor-pointer transition opacity-70";
                }
            });

            // 計算時間差
            const [startH, startM] = activeSchedule.start.split(':');
            const [endH, endM] = activeSchedule.end.split(':');
            const startTime = new Date(y, m-1, d, startH, startM);
            const endTime = new Date(y, m-1, d, endH, endM);

            const statusTag = document.getElementById('subject-status-tag');
            const countdownLabel = document.getElementById('countdown-label');
            const countdownTimer = document.getElementById('countdown-timer');
            const progressCursor = document.getElementById('progress-cursor');
            const progressFill = document.getElementById('progress-fill');

            let diffMs = 0;
            let percentage = 0;

            if (now < startTime) {
                // 尚未開始
                statusTag.innerText = "準備中";
                statusTag.className = "inline-block bg-pink-100 text-pink-700 px-4 py-1 rounded-full text-sm font-bold mb-4";
                countdownLabel.innerText = "距離考試開始還有";
                diffMs = startTime - now;
                percentage = 0;
            } else if (now >= startTime && now <= endTime) {
                // 進行中
                statusTag.innerText = "考試進行中";
                statusTag.className = "inline-block bg-teal-100 text-teal-700 px-4 py-1 rounded-full text-sm font-bold mb-4";
                countdownLabel.innerText = "距離考試結束剩餘";
                diffMs = endTime - now;
                const totalDuration = endTime - startTime;
                const elapsed = now - startTime;
                percentage = (elapsed / totalDuration) * 100;
            } else {
                // 已結束
                statusTag.innerText = "考試已結束";
                statusTag.className = "inline-block bg-gray-200 text-gray-700 px-4 py-1 rounded-full text-sm font-bold mb-4";
                countdownLabel.innerText = "本節考試已結束";
                diffMs = 0;
                percentage = 100;
            }

            // 格式化倒數計時
            if (diffMs > 0) {
                const totalSeconds = Math.floor(diffMs / 1000);
                const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
                const min = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
                const s = String(totalSeconds % 60).padStart(2, '0');
                countdownTimer.innerText = `${h}:${min}:${s}`;
            } else {
                countdownTimer.innerText = "00:00:00";
            }

            // 更新進度條 UI
            progressCursor.style.left = `${percentage}%`;
            progressFill.style.width = `${percentage}%`;
        }

        function renderScheduleBottom() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = "";
            state.schedule.forEach((sch, index) => {
                const el = document.createElement('div');
                el.className = "schedule-card flex-shrink-0 w-64 p-3 rounded-2xl border border-gray-200 bg-white shadow-sm flex items-center gap-3 cursor-pointer";
                el.onclick = () => {
                    state.manualSubjectIndex = index;
                    updateDashboardLogic(); // 立即刷新
                };
                el.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center font-bold text-gray-500 text-sm">
                        ${index + 1}
                    </div>
                    <div class="flex flex-col">
                        <span class="font-bold text-gray-800">${sch.name}</span>
                        <span class="text-xs text-gray-500">${sch.start} - ${sch.end}</span>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        // --- 教師設定 Modal ---
        function openModal() {
            // 將 state 寫入表單
            document.getElementById('set-title').value = state.title;
            document.getElementById('set-date').value = state.date;
            document.getElementById('set-expected').value = state.expected;
            document.getElementById('set-actual').value = state.actual;
            document.getElementById('set-absent-names').value = state.absentNames;
            document.getElementById('set-reminders').value = state.reminders;
            document.getElementById('set-autobell').checked = state.autoBell;
            document.getElementById('set-cursor').value = state.cursor;
            
            renderScheduleSettings();

            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('settings-modal').classList.add('hidden');
            document.getElementById('settings-modal').classList.remove('flex');
        }

        let tempSchedule = [];
        function renderScheduleSettings() {
            tempSchedule = JSON.parse(JSON.stringify(state.schedule));
            drawScheduleSettingsList();
        }

        function drawScheduleSettingsList() {
            const container = document.getElementById('set-schedule-list');
            container.innerHTML = "";
            tempSchedule.forEach((sch, index) => {
                const el = document.createElement('div');
                el.className = "flex gap-2 items-center bg-white p-2 border border-gray-100 rounded-xl shadow-sm";
                el.innerHTML = `
                    <input type="text" value="${sch.name}" onchange="updateTempSchedule(${index}, 'name', this.value)" class="w-1/3 px-3 py-1.5 border border-gray-200 rounded-lg text-sm" placeholder="科目名稱">
                    <input type="time" value="${sch.start}" onchange="updateTempSchedule(${index}, 'start', this.value)" class="w-1/3 px-3 py-1.5 border border-gray-200 rounded-lg text-sm">
                    <input type="time" value="${sch.end}" onchange="updateTempSchedule(${index}, 'end', this.value)" class="w-1/3 px-3 py-1.5 border border-gray-200 rounded-lg text-sm">
                    <button type="button" onclick="removeTempSchedule(${index})" class="p-2 text-pink-400 hover:bg-pink-50 rounded-lg transition" title="刪除">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                    </button>
                `;
                container.appendChild(el);
            });
        }

        window.updateTempSchedule = (index, field, value) => {
            tempSchedule[index][field] = value;
        };
        window.removeTempSchedule = (index) => {
            tempSchedule.splice(index, 1);
            drawScheduleSettingsList();
        };
        window.addScheduleItem = () => {
            tempSchedule.push({ id: Date.now(), name: "新考科", start: "10:00", end: "11:00" });
            drawScheduleSettingsList();
        };

        function saveSettings() {
            state.title = document.getElementById('set-title').value;
            state.date = document.getElementById('set-date').value;
            state.expected = parseInt(document.getElementById('set-expected').value) || 0;
            state.actual = parseInt(document.getElementById('set-actual').value) || 0;
            state.absentNames = document.getElementById('set-absent-names').value;
            state.reminders = document.getElementById('set-reminders').value;
            state.autoBell = document.getElementById('set-autobell').checked;
            state.cursor = document.getElementById('set-cursor').value;
            state.schedule = JSON.parse(JSON.stringify(tempSchedule));
            
            // 重置手動選擇狀態，讓系統根據新設定自動抓取科目
            state.manualSubjectIndex = -1;

            updateUI();
            updateDashboardLogic(); // 立即更新畫面數字
            closeModal();
        }

        // --- 全螢幕功能 ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // 啟動應用
        window.onload = init;
    </script>
</body>
</html>
