<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf8ef">
  <title>監考系統</title>
  <style>
    :root {
      --ink: #41413f;
      --muted: #7d7a73;
      --paper: #fffefb;
      --cream: #fbf8ef;
      --line: #ddd7ca;
      --mint: #66c4a9;
      --mint2: #e2f5ef;
      --pink: #efa8b8;
      --pink2: #fde9ee;
      --yellow: #fff2bd;
      --red: #dc6670;
      --shadow: 0 18px 48px rgba(93, 83, 65, 0.11);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
      color: var(--ink);
      background: #efece5;
    }

    button, input, select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    body {
      padding: clamp(16px, 2.5vh, 32px) clamp(10px, 2vw, 24px) clamp(12px, 2vh, 24px);
      background:
        radial-gradient(circle at 0 0, #fff9e9 0 15%, transparent 40%),
        radial-gradient(circle at 100% 100%, #dcf2ea 0 14%, transparent 38%),
        #efebe3;
    }

    .app {
      max-width: 1560px;
      min-height: calc(100vh - 48px);
      margin: auto;
      padding: clamp(20px, 2.6vmin, 32px);
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 1.8vmin, 20px);
      background: rgba(255, 254, 251, 0.96);
      border: 1px solid rgba(122, 111, 91, 0.17);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      margin-bottom: clamp(6px, 1.2vh, 16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: clamp(24px, min(2.5vw, 4vh), 38px);
      font-weight: 1000;
    }

    .brand-badge {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: var(--mint2);
      display: grid;
      place-items: center;
      font-size: 32px;
      flex-shrink: 0;
    }

    .clock {
      text-align: center;
      font-size: clamp(44px, min(6.2vw, 9.5vh), 96px);
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.05em;
      line-height: 1;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
    }

    .date {
      color: var(--muted);
      font-size: clamp(17px, min(1.5vw, 2.5vh), 24px);
      font-weight: 900;
      text-align: right;
      line-height: 1.3;
    }

    .icon-btn, .soft-btn, .primary-btn, .danger-btn {
      border: 0;
      border-radius: 13px;
      padding: 11px 15px;
      font-weight: 900;
      cursor: pointer;
      transition: filter 0.15s ease;
      white-space: nowrap;
    }

    .icon-btn, .soft-btn {
      background: #f0ede7;
    }

    .primary-btn {
      background: var(--mint);
      color: #fff;
    }

    .danger-btn {
      background: var(--pink2);
      color: #a34c61;
    }

    .icon-btn:hover, .soft-btn:hover, .primary-btn:hover, .danger-btn:hover {
      filter: brightness(0.97);
    }

    .board {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.85fr);
      gap: 18px;
      flex: 1;
    }

    .card {
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 7px 18px rgba(88, 78, 61, 0.05);
    }

    .exam-card {
      padding: clamp(18px, 2.2vmin, 36px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(14px, 1.8vmin, 26px);
      position: relative;
      overflow: hidden;
    }

    .exam-card:after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -74px;
      top: -82px;
      border-radius: 50%;
      background: var(--pink2);
      opacity: 0.68;
      pointer-events: none;
    }

    .exam-header {
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.2vh, 16px);
      position: relative;
      z-index: 1;
    }

    .mode {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      width: fit-content;
      position: relative;
      z-index: 1;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: clamp(14px, 1.1vw, 16px);
      letter-spacing: 0.05em;
      background: var(--pink2);
      color: #a44e63;
      font-weight: 1000;
    }

    .subject-row {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .subject {
      font-size: clamp(48px, min(7.5vw, 10.5vh), 114px);
      font-weight: 1000;
      letter-spacing: 0.06em;
      line-height: 1;
    }

    .period {
      font-size: clamp(20px, min(2.2vw, 3.2vh), 32px);
      font-weight: 1000;
      padding: 8px 20px;
      border-radius: 16px;
      background: #f4f1eb;
      border: 2px solid var(--line);
      white-space: nowrap;
    }

    .exam-timer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(6px, 1vh, 12px);
      width: 100%;
    }

    .timer-panel {
      background: var(--yellow);
      border: 1px solid #eedf9e;
      border-radius: 26px;
      padding: clamp(22px, 3.6vmin, 44px) clamp(20px, 3vmin, 36px);
      width: min(84%, 580px);
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 4px 12px rgba(88, 78, 61, 0.04);
    }

    .timer-label {
      font-size: clamp(20px, min(2.1vw, 3.2vh), 30px);
      font-weight: 1000;
      letter-spacing: 0.04em;
      color: #817348;
      margin-bottom: 8px;
      text-align: center;
    }

    .countdown {
      font-size: clamp(56px, min(9vw, 13.5vh), 136px);
      font-weight: 1000;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.025em;
      text-align: center;
      width: 100%;
    }

    .timer-panel.urgent {
      background: #ffe0df;
      border-color: #eda7aa;
    }

    .timer-panel.urgent .countdown {
      color: #c94f59;
    }

    .progress-wrap {
      position: relative;
      padding-top: 22px;
      width: 100%;
    }

    .progress {
      height: 28px;
      background: #f2eee8;
      border: 2px solid #b9b1a6;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: repeating-linear-gradient(135deg, #58c4a7 0 14px, #87d8c2 14px 28px);
      transition: width 0.8s linear, background 0.25s ease;
    }

    .progress-fill.urgent {
      background: repeating-linear-gradient(135deg, #dc6670 0 14px, #f09ba2 14px 28px);
    }

    .mascot {
      position: absolute;
      top: 0;
      left: 2%;
      transform: translateX(-50%);
      font-size: 32px;
      transition: left 0.8s linear;
      filter: drop-shadow(0 3px 2px rgba(71, 61, 50, 0.15));
    }

    .scale {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: #78736a;
      font-size: clamp(16px, min(1.3vw, 2.2vh), 20px);
      font-weight: 1000;
    }

    .attendance {
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .side-title {
      font-size: 21px;
      font-weight: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .rate {
      font-size: 16px;
      color: #5e9d8c;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .stat {
      padding: 16px 7px;
      border: 1px solid var(--line);
      border-radius: 17px;
      text-align: center;
    }

    .stat span {
      display: block;
      font-weight: 900;
      color: var(--muted);
      font-size: 14px;
    }

    .stat strong {
      font-size: clamp(35px, 4vw, 60px);
      line-height: 1.1;
    }

    .stat.missing strong {
      color: #c96170;
    }

    .notice {
      background: var(--pink2);
      border-radius: 19px;
      padding: 18px;
    }

    .notice b,
    .names b {
      display: block;
      font-size: clamp(16px, min(1.3vw, 2.2vh), 19px);
      font-weight: 1000;
      margin-bottom: 8px;
    }

    .notice b {
      color: #a45266;
    }

    .names b {
      color: #9e4c61;
    }

    .notice p {
      font-size: clamp(22px, 2.5vw, 38px);
      font-weight: 1000;
      margin: 14px 0 0;
    }

    .names {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      background: #f7f4ed;
    }

    .names p {
      font-size: clamp(18px, 1.7vw, 27px);
      font-weight: 900;
      margin: 0;
      min-height: 35px;
    }

    .schedule {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .session {
      border: 2px solid var(--line);
      background: #fff;
      border-radius: 18px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: filter 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }

    .session .num {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: #f2eee8;
      display: grid;
      place-items: center;
      font-weight: 1000;
      font-size: 18px;
      flex-shrink: 0;
    }

    .session strong {
      font-size: 21px;
      font-weight: 1000;
    }

    .session time {
      color: var(--muted);
      font-size: 17px;
      font-weight: 900;
      margin-left: 2px;
    }

    .session.active {
      border-color: var(--mint);
      background: var(--mint2);
    }

    .session.done {
      opacity: 0.58;
    }

    .copyright {
      text-align: center;
      color: #777269;
      font-size: 14px;
      font-weight: 1000;
      letter-spacing: 0.08em;
    }

    .teacher-entry {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
    }

    .teacher-entry .icon-btn {
      font-size: 14px;
    }

    dialog {
      border: 0;
      padding: 0;
      border-radius: 24px;
      color: var(--ink);
      box-shadow: 0 26px 80px rgba(48, 40, 30, 0.3);
    }

    dialog::backdrop {
      background: rgba(48, 43, 37, 0.44);
      backdrop-filter: blur(3px);
    }

    .teacher-dialog {
      width: min(720px, calc(100vw - 24px));
      max-height: 92vh;
    }

    .dialog-head {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      padding: 17px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .dialog-head h2 {
      margin: 0;
      font-size: 23px;
    }

    .head-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .settings-main {
      padding: 22px;
      overflow-y: auto;
      max-height: calc(92vh - 140px);
    }

    .settings-grid {
      display: grid;
      gap: 16px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-weight: 900;
    }

    .field input, .field select {
      width: 100%;
      border: 1px solid #ccc3b8;
      background: #fff;
      padding: 11px 13px;
      border-radius: 11px;
      color: var(--ink);
    }

    .checkline {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: #f7f4ee;
      border-radius: 13px;
      font-weight: 900;
    }

    .checkline input {
      width: 20px;
      height: 20px;
    }

    .session-editor {
      display: grid;
      gap: 8px;
    }

    .session-edit {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr auto;
      gap: 7px;
      padding: 10px;
      background: #f5f2ec;
      border-radius: 14px;
    }

    .session-edit button {
      border: 0;
      background: var(--pink2);
      border-radius: 9px;
      cursor: pointer;
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
    }

    .dialog-foot {
      position: sticky;
      bottom: 0;
      z-index: 5;
      background: var(--paper);
      border-top: 1px solid var(--line);
      padding: 14px 20px;
      display: flex;
      justify-content: flex-end;
      gap: 9px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 23px;
      z-index: 20;
      transform: translate(-50%, 90px);
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      background: #403b36;
      color: #fff;
      padding: 12px 18px;
      border-radius: 13px;
      font-weight: 900;
      pointer-events: none;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    :fullscreen body {
      padding: 0;
    }

    :fullscreen .app {
      max-width: 1680px;
      width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      border: 0;
      border-radius: 0;
      padding: clamp(24px, 3.5vh, 48px) clamp(36px, 6vw, 110px);
      gap: clamp(14px, 2vmin, 22px);
    }

    :fullscreen .fullscreen-hide {
      display: none !important;
    }

    :fullscreen .teacher-entry {
      position: fixed;
      right: 18px;
      bottom: 14px;
      z-index: 12;
      opacity: 0.22;
    }

    :fullscreen .teacher-entry:hover {
      opacity: 1;
    }

    @media (max-width: 900px) {
      .topbar {
        grid-template-columns: 1fr auto;
      }
      .clock {
        grid-column: 1 / -1;
        grid-row: 2;
      }
      .board {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      body {
        padding: 0;
      }
      .app {
        min-height: 100vh;
        border-radius: 0;
      }
      .stats {
        grid-template-columns: repeat(3, 1fr);
      }
      .stat strong {
        font-size: 34px;
      }
      .subject {
        font-size: 52px;
      }
      .countdown {
        font-size: 68px;
      }
      .row {
        grid-template-columns: 1fr;
      }
      .session-edit {
        grid-template-columns: 1fr 1fr;
      }
      .session-edit input:first-child {
        grid-column: 1 / -1;
      }
      .teacher-entry {
        justify-content: center;
      }
      .dialog-head {
        align-items: flex-start;
      }
      .head-actions {
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <!-- 主畫面 (教室大螢幕) -->
  <main class="app" id="classView">
    <header class="topbar">
      <div class="brand">
        <span class="brand-badge">📋</span>
        <span id="boardTitle">期中定期評量</span>
      </div>
      <div class="clock" id="clock">00:00:00</div>
      <div class="top-actions">
        <div class="date" id="dateLabel"></div>
        <button class="icon-btn fullscreen-hide" id="fullBtn">⛶ 全螢幕</button>
      </div>
    </header>

    <section class="board">
      <article class="card exam-card">
        <div class="exam-header">
          <span class="mode" id="modeLabel">準備中</span>
          <div class="subject-row">
            <div class="subject" id="subject">國語</div>
            <div class="period" id="period">08:30－09:20</div>
          </div>
        </div>
        <div class="exam-timer-section">
          <section class="timer-panel" id="timerPanel">
            <div class="timer-label" id="timerLabel">距離考試開始還有</div>
            <div class="countdown" id="countdown">00:00</div>
          </section>
          <div class="progress-wrap">
            <span class="mascot" id="mascot">🌱</span>
            <div class="progress">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="scale">
              <span>開始</span>
              <span>繼續加油</span>
              <span>完成</span>
            </div>
          </div>
        </div>
      </article>

      <aside class="card attendance">
        <div class="side-title">
          <span>👥 應考資訊</span>
          <span class="rate" id="rate">100%</span>
        </div>
        <div class="stats">
          <div class="stat">
            <span>應到</span>
            <strong id="expected">20</strong>
          </div>
          <div class="stat">
            <span>實到</span>
            <strong id="present">20</strong>
          </div>
          <div class="stat missing">
            <span>未到</span>
            <strong id="missing">0</strong>
          </div>
        </div>
        <div class="notice">
          <b>考場提醒</b>
          <p id="noticeText">全體到齊，安心作答！</p>
        </div>
        <div class="names">
          <b>未到學生姓名</b>
          <p id="absentNames">無</p>
        </div>
      </aside>
    </section>

    <!-- 當日考程卡片列表 -->
    <section class="schedule" id="schedule"></section>

    <!-- 教師設定入口與頁尾標註 -->
    <div class="teacher-entry">
      <button class="icon-btn" id="teacherBtn">🔐 教師設定</button>
    </div>
    <div class="copyright">監考系統｜created by 怡臻老師</div>
  </main>

  <!-- 教師設定彈窗 -->
  <dialog class="teacher-dialog" id="teacherDialog">
    <div class="dialog-head">
      <h2>教師控制後台</h2>
      <div class="head-actions">
        <button class="soft-btn" id="autoReset" type="button">↺ 重新重設</button>
        <button class="soft-btn" data-close-teacher type="button">✕</button>
      </div>
    </div>
    <form class="settings-main" id="settingsForm">
      <div class="settings-grid">
        <div class="row">
          <div class="field">
            <label for="titleInput">看板標題</label>
            <input id="titleInput" required>
          </div>
          <div class="field">
            <label for="examDate">考試日期</label>
            <input id="examDate" type="date" required>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="expectedInput">應到人數</label>
            <input id="expectedInput" type="number" min="0" max="99" required>
          </div>
          <div class="field">
            <label for="presentInput">實到人數</label>
            <input id="presentInput" type="number" min="0" max="99" required>
          </div>
        </div>
        <div class="field">
          <label for="absentInput">未到學生姓名</label>
          <input id="absentInput" placeholder="例如：王小明、陳小華；全到請留白">
        </div>
        <div class="field">
          <label for="noticeInput">考場提醒文字</label>
          <input id="noticeInput" placeholder="例如：請專心作答，完成後記得檢查答案">
        </div>
        <div class="row">
          <label class="checkline">
            <input type="checkbox" id="bellEnabled">🔔 自動鐘聲（開始、結束及最後5分鐘）
          </label>
          <div class="field">
            <label for="mascotSelect">進度游標</label>
            <select id="mascotSelect">
              <option value="🌱">🌱 小芽精靈</option>
              <option value="🐣">🐣 圓滾滾小雞</option>
              <option value="🐰">🐰 小兔子</option>
              <option value="🐹">🐹 小倉鼠</option>
              <option value="⭐">⭐ 小星星</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>當日考程</label>
          <div class="session-editor" id="sessionEditor"></div>
          <button class="soft-btn" type="button" id="addSession">＋ 新增考科</button>
          <span class="hint">系統會依目前時間自動切換考科；也可在學生畫面點選下方考科手動切換。</span>
        </div>
      </div>
    </form>
    <div class="dialog-foot">
      <button class="soft-btn" data-close-teacher type="button">取消</button>
      <button class="primary-btn" id="saveSettings" type="button">儲存並套用</button>
    </div>
  </dialog>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'dahu-exam-board-v2';
    const pad = n => String(n).padStart(2, '0');
    const $ = s => document.querySelector(s);
    const today = () => {
      const d = new Date();
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    };

    const defaults = {
      title: '期中定期評量',
      date: today(),
      expected: 20,
      present: 20,
      absentNames: '',
      noticeText: '請專心作答，完成後記得檢查答案。',
      bellEnabled: false,
      mascot: '🌱',
      sessions: [
        { subject: '國語', start: '08:30', end: '09:20' },
        { subject: '英語', start: '09:30', end: '10:10' },
        { subject: '自然', start: '10:30', end: '11:10' }
      ]
    };

    let state = load();
    let manualIndex = null;
    let audioContext = null;
    let lastTick = Date.now();
    let fired = new Set();

    function load() {
      try {
        return { ...defaults, ...JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') };
      } catch {
        return (typeof structuredClone === 'function')
          ? structuredClone(defaults)
          : JSON.parse(JSON.stringify(defaults));
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function esc(v) {
      return String(v).replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }

    function atTime(date, time) {
      const [y, m, d] = date.split('-').map(Number);
      const [h, min] = time.split(':').map(Number);
      return new Date(y, m - 1, d, h, min, 0);
    }

    function duration(ms) {
      const s = Math.max(0, Math.ceil(ms / 1000));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      return h ? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
    }

    function sessions() {
      return state.sessions.map((s, i) => ({
        ...s,
        i,
        startAt: atTime(state.date, s.start),
        endAt: atTime(state.date, s.end)
      }));
    }

    function currentView(now = new Date()) {
      const list = sessions();
      if (manualIndex !== null && list[manualIndex]) {
        const x = list[manualIndex];
        return {
          ...x,
          mode: 'manual',
          remaining: x.endAt - now,
          progress: Math.max(0, Math.min(1, (now - x.startAt) / (x.endAt - x.startAt)))
        };
      }
      const active = list.find(x => now >= x.startAt && now < x.endAt);
      if (active) {
        return {
          ...active,
          mode: 'running',
          remaining: active.endAt - now,
          progress: (now - active.startAt) / (active.endAt - active.startAt)
        };
      }
      const next = list.find(x => now < x.startAt);
      if (next) {
        return {
          ...next,
          mode: 'waiting',
          remaining: next.startAt - now,
          progress: 0
        };
      }
      const last = list.at(-1) || { subject: '尚未設定', start: '--:--', end: '--:--', i: 0, endAt: now };
      return {
        ...last,
        mode: 'done',
        remaining: 0,
        progress: 1
      };
    }

    function renderStatic() {
      $('#boardTitle').textContent = state.title;
      $('#expected').textContent = state.expected;
      $('#present').textContent = state.present;
      const missing = Math.max(0, state.expected - state.present);
      $('#missing').textContent = missing;
      $('#rate').textContent = state.expected ? `${Math.round(state.present / state.expected * 100)}%` : '—';
      $('#absentNames').textContent = state.absentNames.trim() || '無';
      $('#noticeText').textContent = state.noticeText.trim() || '請專心作答，完成後記得檢查答案。';
      $('#mascot').textContent = state.mascot;
      $('#schedule').innerHTML = state.sessions.map((s, i) =>
        `<button class="session" data-i="${i}"><span class="num">${i + 1}</span><strong>${esc(s.subject)}</strong><time>${s.start}－${s.end}</time></button>`
      ).join('');

      document.querySelectorAll('.session').forEach(b => {
        b.onclick = () => {
          manualIndex = Number(b.dataset.i);
          tick();
          toast('已手動切換考科；教師後台可重新重設');
        };
      });
    }

    function tick() {
      const now = new Date();
      const v = currentView(now);
      $('#clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      $('#dateLabel').textContent = new Intl.DateTimeFormat('zh-TW', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        weekday: 'long'
      }).format(now);
      $('#subject').textContent = v.subject;
      $('#period').textContent = `${v.start}－${v.end}`;
      $('#countdown').textContent = duration(v.remaining);
      $('#progressFill').style.width = `${v.progress * 100}%`;
      $('#mascot').style.left = `${Math.max(2, Math.min(98, v.progress * 100))}%`;

      const text = {
        running: ['考試進行中', '本節剩餘時間'],
        waiting: ['下一節準備', '距離考試開始還有'],
        done: ['今日評量完成', '辛苦了，請確認已收齊試卷'],
        manual: ['手動顯示', '本節剩餘時間']
      }[v.mode];

      $('#modeLabel').textContent = text[0];
      $('#timerLabel').textContent = text[1];
      $('#timerPanel').classList.toggle('urgent', (v.mode === 'running' || v.mode === 'manual') && v.remaining > 0 && v.remaining <= 300000);

      document.querySelectorAll('.session').forEach((b, i) => {
        const s = state.sessions[i];
        b.classList.toggle('active', i === v.i);
        b.classList.toggle('done', now >= atTime(state.date, s.end));
      });

      checkBells(now);
      lastTick = now.getTime();
    }

    function ensureAudio() {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
    }

    function chime() {
      if (!state.bellEnabled || !audioContext) return;
      [0, 180, 360].forEach((delay, i) => setTimeout(() => {
        const o = audioContext.createOscillator();
        const g = audioContext.createGain();
        o.frequency.value = [659, 784, 988][i];
        g.gain.setValueAtTime(0.0001, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(0.16, audioContext.currentTime + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.45);
        o.connect(g).connect(audioContext.destination);
        o.start();
        o.stop(audioContext.currentTime + 0.5);
      }, delay));
    }

    function checkBells(now) {
      if (!state.bellEnabled) return;
      sessions().forEach(s => [
        { k: `${s.i}-start`, t: s.startAt.getTime() },
        { k: `${s.i}-five`, t: s.endAt.getTime() - 300000 },
        { k: `${s.i}-end`, t: s.endAt.getTime() }
      ].forEach(e => {
        if (lastTick < e.t && now.getTime() >= e.t && !fired.has(e.k)) {
          fired.add(e.k);
          chime();
        }
      }));
    }

    function toast(msg) {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    function openTeacher() {
      fillSettings();
      $('#teacherDialog').showModal();
    }

    function fillSettings() {
      $('#titleInput').value = state.title;
      $('#examDate').value = state.date;
      $('#expectedInput').value = state.expected;
      $('#presentInput').value = state.present;
      $('#absentInput').value = state.absentNames;
      $('#noticeInput').value = state.noticeText;
      $('#bellEnabled').checked = state.bellEnabled;
      $('#mascotSelect').value = state.mascot;
      renderEditor(state.sessions);
    }

    function renderEditor(rows) {
      $('#sessionEditor').innerHTML = rows.map((s, i) => `
        <div class="session-edit">
          <input aria-label="科目" value="${esc(s.subject)}" placeholder="科目">
          <input aria-label="開始時間" type="time" value="${s.start}">
          <input aria-label="結束時間" type="time" value="${s.end}">
          <button type="button" data-remove="${i}" aria-label="刪除">🗑️</button>
        </div>
      `).join('');

      document.querySelectorAll('[data-remove]').forEach(b => {
        b.onclick = () => b.parentElement.remove();
      });
    }

    function collectSessions() {
      return [...document.querySelectorAll('.session-edit')].map(r => {
        const x = r.querySelectorAll('input');
        return {
          subject: x[0].value.trim() || '未命名',
          start: x[1].value,
          end: x[2].value
        };
      }).filter(s => s.start && s.end && s.start < s.end).sort((a, b) => a.start.localeCompare(b.start));
    }

    $('#teacherBtn').onclick = openTeacher;
    document.querySelectorAll('[data-close-teacher]').forEach(b => {
      b.onclick = () => $('#teacherDialog').close();
    });

    $('#saveSettings').onclick = () => {
      const rows = collectSessions();
      if (!rows.length) return toast('請至少保留一個有效考科');
      state.title = $('#titleInput').value.trim() || '定期評量';
      state.date = $('#examDate').value;
      state.expected = Number($('#expectedInput').value);
      state.present = Number($('#presentInput').value);
      state.absentNames = $('#absentInput').value.trim();
      state.noticeText = $('#noticeInput').value.trim();
      state.bellEnabled = $('#bellEnabled').checked;
      state.mascot = $('#mascotSelect').value;
      state.sessions = rows;
      manualIndex = null;
      if (state.bellEnabled) {
        ensureAudio();
        chime();
      }
      save();
      renderStatic();
      tick();
      $('#teacherDialog').close();
      toast('設定已儲存並套用');
    };

    $('#addSession').onclick = () => {
      $('#sessionEditor').insertAdjacentHTML(
        'beforeend',
        '<div class="session-edit"><input aria-label="科目" value="數學" placeholder="科目"><input aria-label="開始時間" type="time" value="13:30"><input aria-label="結束時間" type="time" value="14:10"><button type="button" aria-label="刪除">🗑️</button></div>'
      );
      $('#sessionEditor').lastElementChild.querySelector('button').onclick = e => e.currentTarget.parentElement.remove();
    };

    $('#autoReset').onclick = () => {
      manualIndex = null;
      tick();
      toast('已重新依目前時間自動判斷考科');
    };

    $('#fullBtn').onclick = () => document.documentElement.requestFullscreen?.();

    // 初始化並啟動主看板
    renderStatic();
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
